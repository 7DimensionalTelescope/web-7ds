# /telescope/computer — control computers in Chile, the Proton server and storage.
#
# Storage servers are added as the archive grows, so the storage table lists the
# current set and the naming convention behind them.

meta:
  title: Computational resources · 7-Dimensional Telescope
  description: On-site control computers, the Proton processing server and the storage behind 7DT.
hero:
  eyebrow: Facilities
  title: "*Computational* resources"
  lede: About 350 GB of raw data are produced each night, transferred from Chile to Seoul and
    reduced the same day.
  image: /img/hero/computer.jpg
  meta:
    - value: "128"
      label: CPU cores
    - value: "2"
      unit: × A100
      label: GPUs
    - value: "3.6"
      unit: PB
      label: Storage
    - value: 66 ± 24
      unit: GB/hr
