site:
  eyebrow: The site
  title: Río Hurtado Valley
  body: "El Sauce Observatory sits in the Rio Hurtado Valley of Chile at 30 deg 28 min 16 sec
    South, 70 deg 45 min 47 sec West, 1,600 m above sea level. It neighbors the sites of Cerro
    Tololo Inter-American Observatory, Gemini South, the Southern Astrophysical Research
    Telescope and the Vera C. Rubin Observatory, and shares their sky conditions: typical seeing
    of about 1.5 arcseconds, more than 300 clear nights a year, and a mean zenith sky brightness
    of 21.97 mag per square arcsecond. Site infrastructure and maintenance are provided by
    ObsTech, a Chilean telescope hosting company."
