infrastructure:
  eyebrow: On site
  title: Infrastructure
  body: Site infrastructure, enclosures and on-site computing hardware are maintained by ObsTech,
    a Chilean telescope hosting company. The array is controlled from sixteen telescope control
    computers and a single main control computer housed at the site; data are handed to the
    Korean processing facility over KREONET each night.
