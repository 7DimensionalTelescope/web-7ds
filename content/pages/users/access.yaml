# /users/access — how 7DS data will be obtained. The query and download service
# does not exist yet, and the page says so rather than describing a process
# nobody can follow.

meta:
  title: Data access · 7DT for users
  description: How 7DS data will be obtained. A public query and download service is being built;
    until it opens, data are requested from the project directly.
hero:
  eyebrow: For users
  title: Data access
  lede: "How 7DS data are obtained: search, query and download. The service is being built; this
    page will describe it when it opens."
  image: /img/hero/data.jpg
status:
  eyebrow: Status
  title: Being built
  panelTitle: To be determined
  body:
    - There is no public interface for querying or downloading 7DS data yet. How data will be
      searched, what may be retrieved at once, how bulk transfers are handled and what
      authentication is required are all still being decided, and this page will set them out
      once they are.
    - Data taken for the surveys carry a proprietary period during which they are available to
      the 7DS team. Membership, and the data rights that come with it, are described under [how
      to propose](/users/propose). Until the service opens, requests — from team members and
      from anyone else — go to the project directly.
  button:
    label: Request data
    href: mailto:mim@astro.snu.ac.kr?subject=7DS%20data%20request
query:
  eyebrow: Query
  title: Data query
  panelTitle: TBD
  body: A query interface — search by position, tile, band, date or depth, and retrieve the
    matching images and catalogs — is to be determined. It will be described here.
