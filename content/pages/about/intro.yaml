# /about/intro — what 7DS is, why it is a medium-band survey, and its history.
#
# History dates are those reported in the project papers and in the site news
# record; every entry should be traceable to one of them.

meta:
  title: What is 7DS · 7-Dimensional Telescope
  description: "The 7-Dimensional Sky Survey: what it measures, why it is built as a medium-band
    survey, and how it has developed since first light in October 2023."
