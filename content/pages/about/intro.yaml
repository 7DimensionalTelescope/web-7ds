  eyebrow: About
  title: What is *7DS*?
  lede: A medium-band survey of the southern sky that measures a low-resolution spectrum for every
    source it observes, and repeats the measurement over time.
  image: /img/hero/about.jpg
  meta:
    - value: 23,000
      unit: deg²
      label: Survey area
    - value: "40"
