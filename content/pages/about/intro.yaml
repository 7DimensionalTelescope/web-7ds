history:
  eyebrow: History
  title: From first light to survey operation
  milestones:
    - when: 2019–2020
      what: Before 7DT
      body: GECKO, the Gravitational-wave Electromagnetic Counterpart Korean Observatory, follows up
        gravitational-wave alerts during the O3 run using existing Korean-accessible telescopes.
        Its campaign on GW190425 covers 621 candidate host galaxies inside a 7,460 deg²
        localization and finds no counterpart — the direct argument for a purpose-built
        facility.
    - when: Oct 2023
      what: First light
      body: The first units observe from El Sauce Observatory in the Río Hurtado Valley, Chile.
        Commissioning begins with twelve of the twenty planned telescopes on sky.
    - when: Feb 2024
      what: First images released
      body: The Center for the Gravitational-wave Universe publishes the first public set of 7DT
        images.
    - when: Jul 2024
      what: Reference Imaging Survey begins
      body: Routine survey operation starts on the wide-area survey, covering roughly 23,000 deg²
        south of Dec +20° with a single visit per tile.
    - when: Aug 2024
      what: Robotic operation
      body: RTCSpy takes over nightly operation. From this point the array plans, observes and hands
        off the night without an operator at the controls.
    - when: Dec 2024
      what: Sixteen units, automated response
      body: "Four more DeltaRho 500 units enter routine operation, and automated target-of-opportunity
        ingestion goes live: the scheduler can interrupt the night and begin a follow-up
        exposure in under a minute."
    - when: Apr 2025
      what: Intensive Monitoring Survey begins
      body: Seven tiles at the south ecliptic pole, chosen to overlap the SPHEREx Deep Field South,
        are observed every available night.
    - when: Late 2025
      what: Thirty-five medium bands
      body: Fifteen further medium-band filters are installed, extending coverage to 375–875 nm and
        advancing toward the designed complement of forty.
    - when: Jun 2026
      what: Commissioning closes
      body: Final commissioning is completed. The facility is reported as an operating observatory,
        with two of the three surveys under way.
    - when: Ahead
      what: Completing the survey
      body: The Wide-area Time-domain Survey commences in 2026. Four remaining units and five
        remaining filters complete the design, and the first full cycle of the Reference Imaging
        Survey is anticipated by the end of 2027.
