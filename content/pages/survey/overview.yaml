# /survey/overview — the three surveys, their tiling, and why there are three.
#
# Each survey's own figures (area, cadence, depth, status, trade-off, goal) are in
# content/data/surveys.yaml under tiers; this page lays them side by side.

meta:
  title: 7-Dimensional Sky Survey · 7DT
  description: "The 7-Dimensional Sky Survey: three surveys covering the southern sky in medium
    bands, from a single-visit reference map to nightly deep monitoring, on one tiling."
