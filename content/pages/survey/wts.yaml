# /survey/wts — the Wide-area Time-domain Survey.
#
# What the survey is for — its goal, rationale, trade-off, area, region and
# cadence — is in content/data/surveys.yaml (tiers), shared with the survey
# overview and the front page; {tier.area} and the like read from there. The
# headings every survey page shares are in content/shared.yaml (surveyPage).
#
# WTS has not started, so the page has no map and no coverage figures — an
# empty map with zeros in it would suggest that it had. It says so instead, in
# `status`.

meta:
  title: Wide-area Time-domain Survey · 7DT
  description: "The time-domain survey of 7DS: 800–1,200 deg² revisited every 10–14 days over five
    years, in fields with existing near-infrared coverage."
hero:
  code: WTS
  name: Wide-area Time-domain Survey
  lede: A moderately wide area revisited every 10 to 14 days for five years, in fields where
    near-infrared data already exist.
  image: /img/hero/survey.jpg
  meta:
    - value: 800–1,200
      unit: deg²
      label: Survey area
    - value: 10–14
      unit: d
      label: Cadence
    - value: 90–100
      label: Visits per tile
    - value: "2026"
      label: Commencing
parameters:
  - - Area
    - "{tier.area}"
  - - Field selection
    - "{tier.region}"
  - - Cadence
    - "{tier.cadence}"
  - - Visits per tile
    - 90–100 over five years
  - - Cumulative depth
    - 22.0–22.5 mag in most medium bands
  - - Status
    - "{tier.statusLabel}"
status:
  eyebrow: Status
  title: Not yet started
  panelTitle: Field selection under consideration
  body: WTS is scheduled to commence in 2026. Fields are being selected to overlap existing
    near-infrared coverage — the VISTA Kilo-degree Infrared Galaxy survey footprint and the Vera
    C. Rubin Observatory Deep Drilling Fields are the leading candidates — so that 7DT
    medium-band photometry is complemented at wavelengths the array cannot reach. Until
    observations begin there is no coverage to report; tiles observed under the Reference
    Imaging Survey in these fields already exist and are shown on the [data access
    page](/users/access).
science:
  eyebrow: Science
  title: What the cadence is chosen for
  body:
    - "{tier.depthRange}"
    - Stacking 90 to 100 visits also reaches 22.0–22.5 mag across most of the medium bands, deep
      enough for photometric redshifts on galaxies well below the single-visit limit. Forecast
      redshift precision for the stacked survey is given under [cosmology and photometric
      redshifts](/science/cosmology).
