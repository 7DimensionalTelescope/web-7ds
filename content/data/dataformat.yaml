note: 7DT data format, from the '7DT Data Format Specification for Science Working Groups'.
  Structured rather than written into the page so a revision of the specification is a change to
  this file. Every row is quoted from the specification; nothing here is inferred.
products:
  - - Calibrated single exposure
    - "*_100s.fits"
    - FITS image, 32-bit float, 9576 × 6388 px, ~234 MB, image in HDU 0
    - Bias, dark and flat corrected single exposure. Pixel values remain in instrumental ADU.
  - - Coadd
    - "*_coadd.fits"
    - FITS image, 32-bit float, standard grid 10200 × 6800 px, ~265 MB, image in HDU 0
    - Resampled stack on a common grid. Pixel values are flux-scaled to approximately µJy per
      pixel.
basename:
  - - T08147
    - RIS tile number, or a free target
  - - m650
    - Filter
  - - 7DT02
    - Telescope unit
  - - 20251126_043413
    - UTC date and time
  - - 100s
    - Exposure time
suffixes:
  - - _coadd
    - Coadded image. May be a nightly stack or a longer multi-epoch one.
  - - _cat
    - Source catalog for the preceding image product. Empty primary HDU 0, source binary table
      in HDU 1.
  - - _weight
    - Coadd inverse-variance weight map, in the primary image HDU.
  - - _footprint
    - Per-pixel contributing-frame information, where produced. Availability depends on the
      processing route.
conventions:
  - - WCS
    - Single-frame distortion is represented with TPV (TAN--TPV), not SIP. Coadds are resampled
      onto a TAN grid.
  - - Single-frame units
    - Instrumental detector values in ADU after basic calibration.
  - - Coadd units
    - Flux-scaled to µJy per pixel.
  - - Pixel scale
    - 0.505 arcsec per pixel, so a single exposure covers about 1.34° × 0.90°.
  - - Filter identifier
    - Medium bands are prefixed m, from m400 to m875, with some wider bands suffixed w as in
      m466w. Broad bands are u, g, r, i and z.
  - - Dates
    - The observing-night date and the UTC date encoded in a basename may differ by one calendar
      day.
headerGroups:
  - title: What the observation was
    rows:
      - - OBJECT
        - Target or survey-tile identifier.
      - - FILTER
        - Filter used for the observation.
      - - TELESCOP
        - 7DT telescope unit identifier.
      - - EXPTIME
        - Exposure time. For a coadd, the sum of the contributing exposure times.
      - - DATE-OBS
        - UTC observation timestamp. For a coadd, the mean time of the contributing frames.
      - - MJD
        - Observation time as Modified Julian Date. For a coadd, the mean of the inputs.
      - - AIRMASS
        - Airmass of the observation.
      - - MOONSEP
        - Angular separation from the Moon, degrees.
      - - IMAGEID
        - Unique image identifier.
      - - PIPE_VER
        - Py7DT pipeline version stamp.
  - title: How good it is
    rows:
      - - RSEP_Q2
        - "Astrometric quality: representative separation of sources from Gaia DR3, arcsec.
          Variants RMS, MIN, MAX, Q1, Q2, Q3, P95, P99."
      - - ISEP_Q2
        - "Astrometric quality: representative separation within 7DT images taken together,
          arcsec. Same set of variants."
      - - BIN0FWHM
        - PSF size as it varies across the field. BIN0, BIN1, BIN2 run from center to corner,
          equally spaced in squared radial distance.
      - - SEEING, PEEING
        - PSF FWHM, corners excluded, in arcsec and in pixels.
      - - ELLIP, ELONG
        - PSF ellipticity and elongation, corners excluded.
      - - SKYVAL, SKYSIG
        - Median and sigma of the sky background.
      - - SATURATE
        - Pixel saturation level. Read per image, since it can differ between products.
      - - SANITY
        - Pipeline quality control. False marks a frame that should normally be excluded.
      - - REJ_PROC
        - Processing stage at which the image was rejected, where a rejection was recorded.
  - title: How to turn counts into magnitudes
    rows:
      - - APER, APER_1–APER_5
        - Fixed aperture definitions used for photometry. The SExtractor AUTO aperture is not
          among them.
      - - ZP_AUTO, ZP_0–ZP_5
        - AB magnitude zero points for AUTO and for each fixed aperture.
      - - EZP_*
        - Uncertainty on the corresponding zero point.
      - - UL5_*, UL3_*
        - 5σ and 3σ limiting magnitudes for the corresponding aperture. Not defined for AUTO.
      - - EGAIN
        - Effective gain in e⁻ per ADU. Not the same as the camera keyword GAIN.
  - title: Where it came from
    rows:
      - - PPFLAG
        - "Bitwise-OR calibration provenance: 0 same-date raw calibration, 1 nearby-date
          calibration, 2 manually generated master, 4 a SANITY=False input was used, 8 masters
          matched by ignoring lenient keys, 16 masters matched by ignoring temporal bounds, 32
          masters matched by ignoring hard keys."
      - - IMCMB###, IMCID###
        - Input master frame identifiers, recorded in single-image headers.
      - - IMG#####, IID#####
        - Input image identifiers, recorded in coadd headers.
catalogExample:
  - - MAG_APER
    - Instrumental aperture magnitude.
  - - MAG_APER_m650
    - Calibrated aperture magnitude in m650.
  - - FLUX_APER
    - Instrumental aperture flux.
  - - FLUX_APER_m650
    - Calibrated aperture flux in m650.
catalogGroups:
  - title: Position and shape
    rows:
      - - ALPHA_J2000, DELTA_J2000
        - Source sky position, J2000.
      - - X_IMAGE, Y_IMAGE
        - Source position in image pixel coordinates.
      - - FWHM_IMAGE
        - Source FWHM in pixels.
      - - ELLIPTICITY
        - Source ellipticity.
      - - CLASS_STAR
        - SExtractor stellarity, for star/galaxy separation.
      - - FLAGS
        - Source-extraction quality flags.
  - title: Instrumental measurements
    rows:
      - - MAG_AUTO
        - Instrumental SExtractor AUTO magnitude.
      - - MAG_APER–MAG_APER_5
        - Instrumental fixed-aperture magnitudes. Apertures are defined in the image header.
      - - MAGERR_*
        - Uncertainty on the corresponding instrumental magnitude.
      - - FLUX_AUTO, FLUX_APER*
        - Instrumental flux measurements.
      - - FLUXERR_*
        - Uncertainty on the corresponding instrumental flux.
      - - SNR_*
        - Signal-to-noise ratio for the corresponding measurement.
  - title: Calibrated photometry
    rows:
      - - MAG_*_<filter>
        - Calibrated magnitude in the observed 7DT filter.
      - - MAGERR_*_<filter>
        - Uncertainty on the calibrated magnitude.
      - - FLUX_*_<filter>
        - Calibrated flux in the observed 7DT filter.
      - - FLUXERR_*_<filter>
        - Uncertainty on the calibrated flux.
  - title: Gaia cross-match
    rows:
      - - source_id
        - Identifier of the matched Gaia reference source.
      - - ra, dec
        - Gaia reference-source position.
      - - phot_g_mean_mag, bp_rp
        - Gaia broad-band photometry.
      - - separation
        - Angular separation between the detected source and its Gaia match.
      - - mag_m400 … mag_m875, mag_u–mag_z
        - Gaia-XP synthetic reference magnitudes across the 7DS filter set, wide bands included.
