# Text used on more than one page. Each entry says where it appears; change it
# here and every page that shows it follows.

# Shown on /telescope/instrument, /users/performance.
filterSet:
  body: Every unit carries a nine-slot filter wheel. Three slots in each wheel hold Sloan g, r and
    i; one unit adds u and three units add z. The remaining slots hold medium-band filters,
    distributed across the array so that the full set is covered in a small number of exposures.
    The original twenty medium bands are spaced regularly at 25 nm from 400 to 875 nm with 25 nm
    FWHM. Fifteen more, procured from Edmund Optics and installed in late 2025, fill the gaps
    between them with central wavelengths from 412 to 832 nm and bandwidths of 14 to 41 nm. The
    current suite of 35 filters covers 375 to 875 nm, advancing toward the designed complement
    of 40 medium bands at 12.5 nm spacing.
  caveat: "The additional fifteen filters depart from the regularity of the original set: their
    central wavelengths are not precisely aligned to the 12.5 nm grid, their bandwidths vary,
    and no filter between 700 and 800 nm is included in the second batch. These departures
    reflect availability and will be addressed as the remaining five filters become available.
    Their spectrophotometric calibration is in preparation; the original twenty remain the
    calibrated set in operational use."

# Shown on /survey/ris, /survey/wts, /survey/ims.
surveyPage:
  eyebrow: Survey · {code}
  strategy:
    eyebrow: Strategy
    title: What this survey is for
    trade: Trade
    parameters: Design parameters
  map:
    eyebrow: Map
    title: Where it has observed
    updated: daily
    footnote: The whole survey footprint, with per-tile detail under the pointer and a search by
      position, is on the [data access page](/users/access).
  coverage:
    eyebrow: Coverage
    title: What has been observed so far
    updated: every 30 minutes
    status: Status
    meter: "{code} progress: {percent} percent"
  related:
    eyebrow: Elsewhere
    title: Related pages
    links:
      - label: All three surveys
        href: /survey/overview
      - label: Sky coverage and search
        href: /users/access
      - label: Array operations
        href: /users/status
      - label: Measured performance
        href: /users/performance

# Shown on every science theme page, /science/mma to /science/solar. The
# themes themselves are in content/data/science.yaml.
sciencePage:
  # Appended to the theme's title in the browser tab.
  titleSuffix: " · 7DS science"
  eyebrow: Science · Theme {n}
  background:
    eyebrow: Background
    title: Why it matters
  approach:
    eyebrow: Approach
    title: What 7DS contributes
  figures:
    eyebrow: Figures
    title: What it looks like
  targets:
    eyebrow: Targets
    title: What the program aims to deliver
    note: These are program targets over the seven years of the survey, not results in hand. What
      has been observed so far is on the [status page](/users/status), and published work is
      listed under [publications](/publication/list).
  continue:
    eyebrow: Continue
    title: Other themes
    previous: ← {title}
    next: "{title} →"
    all:
      label: All seven themes
      href: /science/overview
