  brand:
    label: 7-Dimensional Telescope — home
    alt: 7DT
    logo: /img/logo_name.png
  home: Home
  menus:
    - key: manuAbout
      label: About
      href: /about/intro
      items:
        - label: What is 7DS
          href: /about/intro
        - label: Team
          href: /about/team
        - label: Funding
          href: /about/funding
    - key: manuScience
