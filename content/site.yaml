# Site-wide furniture: the navigation bar and the footer, shown on every page.
#
# In nav.menus, `key` ties a menu to the pages that highlight it (a page's
# PageLayout `menu`); `href` is where the menu's own label leads, and `items`
# are its dropdown. nav.links are the single links after the menus.

