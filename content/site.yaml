        - label: Cosmology
          href: /science/cosmology
        - label: Active Galactic Nuclei
          href: /science/agn
        - label: Galactic Science & Exoplanets
          href: /science/galactic
        - label: Solar System Objects
          href: /science/solar
    - key: manu7ds
