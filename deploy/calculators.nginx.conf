# Serving the 7DT observation calculators from 7ds.snu.ac.kr
# ----------------------------------------------------------
# Paste these location blocks into the `server { listen 443 ssl; ... }` block of
# /etc/nginx/conf.d/7ds.conf, ABOVE the existing `location / { ... }`, then
# `sudo nginx -t && sudo systemctl reload nginx`. Needs sudo, so an operator has
# to do it.
#
# Why it is needed rather than an iframe: 7ds.snu.ac.kr is served over HTTPS and
# sends `Content-Security-Policy: default-src 'self' ...`. `frame-src` falls back
# to `default-src`, so the browser blocks a frame pointing at any other origin,
# and a plain-HTTP frame inside an HTTPS page is blocked as mixed content on top
# of that. Proxying makes the calculators same-origin and both problems go away.
#
# The apps also have to be started with a matching base path, so their own asset
# and websocket URLs are built under it. On lyman, in 7DT_calculator:
#
#   PORT=8509 ./run_visibility.sh   --server.baseUrlPath=/calculator/visibility/app
#   PORT=8510 ./run_etc.sh          --server.baseUrlPath=/calculator/exposure/app
#   PORT=8511 ./run_overhead.sh     --server.baseUrlPath=/calculator/overhead/app
#   PORT=8512 ./run_tiles.sh        --server.baseUrlPath=/calculator/tiles/app
#
# (or add `--server.baseUrlPath` to the streamlit line inside each run_*.sh).

# Streamlit talks over a websocket on /_stcore/stream; without the Upgrade
# headers the page loads and then sits on "Connecting...".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

location /calculator/visibility/app/ {
    proxy_pass http://lyman.snu.ac.kr:8509/calculator/visibility/app/;
    include /etc/nginx/conf.d/calculators-proxy.inc;
}

location /calculator/exposure/app/ {
    proxy_pass http://lyman.snu.ac.kr:8510/calculator/exposure/app/;
    include /etc/nginx/conf.d/calculators-proxy.inc;
}

location /calculator/overhead/app/ {
    proxy_pass http://lyman.snu.ac.kr:8511/calculator/overhead/app/;
    include /etc/nginx/conf.d/calculators-proxy.inc;
}

location /calculator/tiles/app/ {
    proxy_pass http://lyman.snu.ac.kr:8512/calculator/tiles/app/;
    include /etc/nginx/conf.d/calculators-proxy.inc;
}
