# Serving the 7DT observation calculators from 7ds.snu.ac.kr
# ----------------------------------------------------------
# The apps run on THIS host under pm2 (deploy/calculators.config.cjs), each on
# 127.0.0.1 with a base path matching the location below. Nothing outside the
# machine can reach them except through these blocks.
#
# Paste the four location blocks into the `server { listen 443 ssl; ... }`
# block of /etc/nginx/conf.d/7ds.conf, ABOVE the existing `location / { ... }`.
# calculators-map.conf and calculators-proxy.inc must be installed first — see
# deploy/SUDO.md, step 3.

location /calculator/visibility/app/ {
    proxy_pass http://127.0.0.1:8509;
    include /etc/nginx/conf.d/calculators-proxy.inc;
}

location /calculator/exposure/app/ {
    proxy_pass http://127.0.0.1:8510;
    include /etc/nginx/conf.d/calculators-proxy.inc;
}

location /calculator/overhead/app/ {
    proxy_pass http://127.0.0.1:8511;
    include /etc/nginx/conf.d/calculators-proxy.inc;
}

location /calculator/tiles/app/ {
    proxy_pass http://127.0.0.1:8512;
    include /etc/nginx/conf.d/calculators-proxy.inc;
}

# proxy_pass carries no URI part on purpose: the request path is passed through
# unchanged, and each app was started with --server.baseUrlPath set to exactly
# that prefix, so /calculator/exposure/app/_stcore/stream reaches the app as the
# app expects it. Adding a trailing path here would strip the prefix and break
# every asset and websocket URL the app generates.
