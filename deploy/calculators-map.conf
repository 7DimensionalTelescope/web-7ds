# Install as /etc/nginx/conf.d/calculators-map.conf
#
# `map` is only valid in the http context. Files in conf.d are included inside
# http {}, so this works as its own file — but it must NOT be pasted inside the
# `server { ... }` block of 7ds.conf, where nginx will refuse to start.
#
# Streamlit talks over a websocket at /_stcore/stream; without the Upgrade
# header the page loads and then sits on "Connecting...".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
